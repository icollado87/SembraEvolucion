<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:16px;background:#fff;font-family:var(--font-body)}</style></head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const {DataTable,FilterPill,Badge} = window.DesignSystemSEMBRA_f9fdf7;

const cols=[{key:'id',label:'Código',link:true},{key:'cultivo',label:'Cultivo'},{key:'ht',label:'HT'},{key:'estado',label:'Estado',render:r=>{const map={Aprobada:'success',Vencida:'warning',Cancelada:'danger'};return <Badge tone={map[r.estado]||'neutral'}>{r.estado}</Badge>}}];
const rows=[{id:'LC-00812',cultivo:'Cebada',ht:'120',estado:'Aprobada'},{id:'LC-00813',cultivo:'Trigo',ht:'268',estado:'Vencida'},{id:'LC-00814',cultivo:'Soja',ht:'54',estado:'Cancelada'}];
const App=()=>(<div style={{display:'flex',flexDirection:'column',gap:12}}>
<div style={{display:'flex',gap:8,flexWrap:'wrap'}}><FilterPill label="Cultivo" value="Todos"/><FilterPill label="Estado" value="Aprobada" active/><FilterPill label="Campaña" value="2025/26"/></div>
<DataTable columns={cols} rows={rows}/>
</div>);
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
