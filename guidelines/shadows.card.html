<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-body);color:var(--text-primary)}</style></head><body>
<div style="display:flex;gap:20;padding:12px;background:#F7F9FC;border-radius:12px">
<div style="flex:1;height:100px;background:#fff;border-radius:12px;box-shadow:0 1px 2px rgba(28,28,28,.06),0 4px 12px rgba(28,28,28,.06);display:flex;align-items:center;justify-content:center;font-weight:700">Card</div>
<div style="flex:1;height:100px;background:#fff;border-radius:12px;box-shadow:0 12px 32px rgba(28,28,28,.18);display:flex;align-items:center;justify-content:center;font-weight:700">Modal</div>
<div style="flex:1;height:100px;background:#fff;border-radius:12px;box-shadow:0 0 0 3px rgba(191,255,0,.5);border:2px solid #BFFF00;display:flex;align-items:center;justify-content:center;font-weight:700">Focus</div>
</div></body></html>
