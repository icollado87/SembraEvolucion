<!-- @dsCard group="Colors" name="Semantic" subtitle="Estados unificados (propuesta)" viewport="700x160" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-body);color:var(--text-primary)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10">
<div><div style="height:76px;background:#BFFF00;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700">Aprobada</div><div style="font-size:12px;color:#4A5261;margin-top:4px">--se-success</div></div>
<div><div style="height:76px;background:#FFA945;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700">Vencida</div><div style="font-size:12px;color:#4A5261;margin-top:4px">--se-warning</div></div>
<div><div style="height:76px;background:#D64545;border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">Cancelada</div><div style="font-size:12px;color:#4A5261;margin-top:4px">--se-danger</div></div>
<div><div style="height:76px;background:#4A5261;border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">Neutral</div><div style="font-size:12px;color:#4A5261;margin-top:4px">--se-neutral</div></div>
</div></body></html>
