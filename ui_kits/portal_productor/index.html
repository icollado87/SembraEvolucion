<!doctype html><html><head><meta charset="utf-8"><title>Portal Productor · Mobile</title>
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;padding:0;background:#EEF1F7}#root{max-width:428px;margin:0 auto;background:#fff;min-height:100vh;overflow:hidden}</style>
</head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="./HomeMobile.jsx"></script>
<script type="text/babel" src="./CompraHT.jsx"></script>
<script type="text/babel" src="./Licencias.jsx"></script>
<script type="text/babel" src="./CuentaGranaria.jsx"></script>
<script type="text/babel">
function App(){
  const [screen,setScreen]=React.useState('home');
  const map={home:window.HomeMobile,compras:window.CompraHT,lic:window.Licencias,cg:window.CuentaGranaria};
  const Screen=map[screen]||window.HomeMobile;
  return <Screen onNav={k=>setScreen(k in map?k:screen)}/>;
}
const wait=()=>{if(window.HomeMobile&&window.CompraHT&&window.Licencias&&window.CuentaGranaria){ReactDOM.createRoot(document.getElementById('root')).render(<App/>)}else setTimeout(wait,50)};wait();
</script>
</body></html>
